{% extends "base.html" %}
{% block content %}

<div class="bg-white shadow rounded-lg p-6">
    <h4 class="text-lg font-semibold mb-4">Limit Calculator</h4>

    <form method="POST" action="{{ url_for('func_limit') }}"></form> class="space-y-4">
        <div>
            <label class="block text-sm mb-1">Function</label>
            <input type="text" name="function"
                value="{{ function }}"
                class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200"
                placeholder="Example: (x^2 - 1)/(x - 1)" required>
        </div>

        <div>
            <label class="block text-sm mb-1">Value of x</label>
            <input type="text" name="x_value"
                value="{{ x_value }}"
                class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200"
                placeholder="Example: 1 atau oo" required>
        </div>

        <div id="previewBox" class="mt-3 bg-gray-50 border px-4 py-3 rounded">
            <p class="text-sm text-gray-600 mb-1">Preview:</p>
            <div id="mathPreview" class="text-lg"></div>
        </div>

        <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
            Calculate
        </button>
    </form>

    {% if result %}
    <div class="mt-4 bg-green-100 text-green-800 px-4 py-3 rounded">
        <strong>Limit Result:</strong> {{ result }}
    </div>
    {% endif %}

    {% if error %}
    <div class="mt-4 bg-red-100 text-red-800 px-4 py-3 rounded">
        {{ error }}
    </div>
    {% endif %}
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const funcInput = document.querySelector('input[name="function"]');
        const xInput = document.querySelector('input[name="x_value"]');
        const previewBox = document.getElementById('previewBox');
        const preview = document.getElementById('mathPreview');

        function updatePreview() {
            const funcValue = funcInput.value.trim();
            const xValue = xInput.value.trim();

            if (!funcValue) {
                preview.innerHTML = '';
                return;
            }

            let latexFunc = funcValue
                .replace(/\*/g, '\\cdot ')
                .replace(/\^([0-9]+)/g, '^{$1}')
                .replace(/\//g, '\\over ');

            let latexX = xValue ? xValue : '?';

            preview.innerHTML = `
                $$ \\lim_{x \\to ${latexX}} ${latexFunc} $$
            `;

            if (window.MathJax) {
                MathJax.typesetPromise([preview]);
            }
        }

        funcInput.addEventListener('input', updatePreview);
        xInput.addEventListener('input', updatePreview);

        updatePreview();
    });
</script>

{% endblock %}
