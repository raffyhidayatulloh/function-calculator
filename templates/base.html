<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ title if title else "Function Calculator" }}</title>

        <!-- Poppins -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <!-- Tailwind CDN -->
        <script src="https://cdn.tailwindcss.com"></script>

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            poppins: ['Poppins', 'sans-serif']
                        }
                    }
                }
            }
        </script>
    </head>

    <body class="bg-gray-100 font-poppins">

    <!-- Navbar -->
    <nav class="bg-white border-b relative z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/limit" class="text-lg font-semibold">
                Function Calculator
            </a>

            <div class="flex items-center gap-3">
                <button id="helpBtn" class="focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                    </svg>
                </button>
                <button id="menuBtn" class="focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Menu Content -->
        <div id="mobileMenu" class="hidden absolute top-full left-0 w-full bg-white border-b shadow-lg z-40 transition-all duration-300">
            <div class="max-w-6xl mx-auto px-4 py-2 flex flex-col">
                <a href="/limit" class="flex items-center py-3 px-2 rounded hover:bg-gray-100 transition">
                    <img src="{{ url_for('static', filename='icon/lim_icon.svg') }}" class="w-9 h-9 mr-2" alt="Limit Icon">
                    Limits
                </a>

                <a href="/derivative" class="flex items-center py-3 px-2 rounded hover:bg-gray-100 transition">
                <img src="{{ url_for('static', filename='icon/der_icon.svg') }}" class="w-9 h-9 mr-2" alt="Derivative Icon">
                    Derivatives
                </a>

                <a href="/composition" class="flex items-center py-3 px-2 rounded hover:bg-gray-100 transition">
                <img src="{{ url_for('static', filename='icon/com_icon.svg') }}" class="w-7 h-7 mr-2" alt="Composition Icon">
                    Compositions
                </a>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="max-w-3xl mx-auto px-4 mt-10 relative z-0">
        {% block content %}{% endblock %}
    </div>

    <!-- Modal -->
    <div id="helpModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-lg shadow-lg p-6 relative overflow-y-auto max-h-[80vh]">
            
            <button id="closeHelp"
                class="absolute top-2 right-2 text-gray-500 hover:text-gray-800 text-2xl p-1">
                &times;
            </button>

            <h3 class="font-semibold mb-4">List of Mathematical Functions and Constants</h3>
            <ul class="text-sm">
                <li class="flex items-center gap-2 py-1 pb-2">
                    <span class="font-mono bg-gray-100 px-2 py-1 rounded">sqrt(x)</span>
                    - square root
                </li>
                <li class="flex items-center gap-2 py-2">
                    <span class="font-mono bg-gray-100 px-2 py-1 rounded">exp(x)</span>
                    -
                    <img src="{{ url_for('static', filename='icon/exp.svg') }}" class="w-5 h-5" alt="Exp Icon">
                </li>
                <li class="flex items-center gap-2 py-1">
                    <span class="font-mono bg-gray-100 px-2 py-1 rounded">a + b</span>
                    -
                    <img src="{{ url_for('static', filename='icon/a_plus_b.svg') }}" class="w-10 h-10" alt="Plus Icon">
                </li>
                <li class="flex items-center gap-2 py-1 pb-2">
                    <span class="font-mono bg-gray-100 px-2 py-1 rounded">a - b</span>
                    -
                    <img src="{{ url_for('static', filename='icon/a_minus_b.svg') }}" class="w-10 h-10" alt="Minus Icon">
                </li>
                <li class="flex items-center gap-2 py-1">
                    <span class="font-mono bg-gray-100 px-2 py-1 rounded">a * b</span>
                    -
                    <img src="{{ url_for('static', filename='icon/a_cdot_b.svg') }}" class="w-8 h-8" alt="Cdot Icon">
                </li>
                <li class="flex items-center gap-2 py-3">
                    <span class="font-mono bg-gray-100 px-2 py-1 rounded">a / b</span>
                    -
                    <img src="{{ url_for('static', filename='icon/frac_a_b.svg') }}" class="w-8 h-8" alt="Frac Icon">
                </li>
                <li class="flex items-center gap-2 py-1">
                    <span class="font-mono bg-gray-100 px-2 py-1 rounded">a**b</span>
                    -
                    <img src="{{ url_for('static', filename='icon/a_pow_b.svg') }}" class="w-5 h-5" alt="Pow Icon">
                </li>
            </ul>
        </div>
    </div>

    <!-- JS Toggle -->
    <script>
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const navbar = document.querySelector('nav');

        const helpBtn = document.getElementById('helpBtn');
        const helpModal = document.getElementById('helpModal');
        const closeHelp = document.getElementById('closeHelp');

        // Menu toogle
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            mobileMenu.classList.toggle('hidden');
        });

        mobileMenu.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Close menu
        document.addEventListener('click', (e) => {
            if (!navbar.contains(e.target)) {
                mobileMenu.classList.add('hidden');
            }
        });

        helpBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            helpModal.classList.remove('hidden');
        });

        closeHelp.addEventListener('click', () => {
            helpModal.classList.add('hidden');
        });

        helpModal.addEventListener('click', (e) => {
            if (e.target === helpModal) {
                helpModal.classList.add('hidden');
            }
        });
    </script>


    <script>
    window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
    };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    </body>
</html>
